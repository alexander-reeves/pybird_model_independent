# DESI DR1 full-shape + post-reconstruction BAO, 6 samples, ell = 0,2, 0.02 < k < 0.20 h/Mpc.
# Copied from pybird-milan/data/desi_dr1/likelihood_config_v1/ALL.yaml (the DESI key-project
# setup of demo/run_desi_fs_bao.ipynb), with two edits: an absolute data_path, and
# with_emu: True, which the HMC needs. Everything else -- data, window, joint FS+BAO
# covariance, k-cuts, EFT basis and priors -- is unchanged.
data_path: '/capstor/store/cscs/swissai/a0158/areeves/pybird_model_independent/data/desi_dr1_fs_bao'
data_file: 'desi_dr1_kp_fs_bao.h5'

output: 'bPk'
multipole: 2

with_bao_rec: True   # post-reconstruction BAO alphas appended to the FS data vector
with_emu: True       # 80-knot loop emulator: required for HMC (the demo notebook minimises with the exact loops)

with_ap: True
with_survey_mask: True

sky:
     BGS:  
          min: [0.02, 0.02]
          max: [0.20, 0.20]
          nd: 3.e-4 
     LRG1:  
          min: [0.02, 0.02]
          max: [0.20, 0.20] 
          nd: 3.e-4 
     LRG2:  
          min: [0.02, 0.02]
          max: [0.20, 0.20] 
          nd: 2.e-4 
     LRG3:  
          min: [0.02, 0.02]
          max: [0.20, 0.20] 
          nd: 1.e-4 
     ELG2:  
          min: [0.02, 0.02]
          max: [0.20, 0.20] 
          nd: 1.e-4 
     QSO:  
          min: [0.02, 0.02]
          max: [0.20, 0.20] 
          nd: 2.e-5

write:
    save: False
    fake: False
    plot: False
    show: False
    out_path: '/capstor/store/cscs/swissai/a0158/areeves/pybird_model_independent/output'
    out_name: 'desi_dr1'

km: 0.7
kr: 0.25

eft_basis: 'westcoast' # b1, c2, c4, b3 (biased parameters) & cct, cr1, cr2 (counterterms)
with_stoch: True # ce0, ce1, ce2 
with_nnlo_counterterm: False # cr4, cr6
with_loop_prior: False

eft_prior:
     b1:
          type: flat 
          mean: [2., 2., 2., 2., 2., 2., 2.]
          range: [5., 5., 5., 5., 5., 5., 5.]
     c2:
          type: gauss
          mean: [0., 0., 0., 0., 0., 0., 0.] 
          range: [5., 5., 5., 5., 5., 5., 5.]  
     c4:
          type: unvaried
          mean: [0., 0., 0., 0., 0., 0., 0.] 
          range: [5., 5., 5., 5., 5., 5., 5.]  
     b3:
          type: marg_gauss
          mean: [0., 0., 0., 0., 0., 0., 0.] 
          range: [5., 5., 5., 5., 5., 5., 5.]  
     cct: # mu^0 k^2 P11
          type: marg_gauss
          mean: [0., 0., 0., 0., 0., 0., 0.] 
          range: [5., 5., 5., 5., 5., 5., 5.]  
     cr1: # mu^2 k^2 P11
          type: marg_gauss
          mean: [0., 0., 0., 0., 0., 0., 0.] 
          range: [5., 5., 5., 5., 5., 5., 5.]  
     cr2: # mu^4 k^2 P11
          type: marg_gauss
          mean: [0., 0., 0., 0., 0., 0., 0.] 
          range: [5., 5., 5., 5., 5., 5., 5.]  
     ce0: # k^0 monopole
          type: marg_gauss
          mean: [0., 0., 0., 0., 0., 0., 0.] 
          range: [2., 2., 2., 2., 2., 2., 2.]  
     ce1: # mu^0 k^2 / km^2
          type: marg_gauss
          mean: [0., 0., 0., 0., 0., 0., 0.] 
          range: [5., 5., 5., 5., 5., 5., 5.]  
     ce2: # f mu^2 k^2 / kr^2
          type: marg_gauss
          mean: [0., 0., 0., 0., 0., 0., 0.] 
          range: [5., 5., 5., 5., 5., 5., 5.] 
     # cr4: # mu^4 k^4 P11 (nnlo)
     #      type: marg_gauss
     #      mean: [0., 0., 0., 0., 0., 0., 0.] 
     #      range: [5., 5., 5., 5., 5., 5., 5.]  
     # cr6: # # mu^6 k^4 P11 (nnlo)
     #      type: marg_gauss
     #      mean: [0., 0., 0., 0., 0., 0., 0.] 
     #      range: [5., 5., 5., 5., 5., 5., 5.]  





